# Loads every dashboard JSON dropped in /var/lib/grafana/dashboards.
apiVersion: 1

providers:
  - name: codestar
    orgId: 1
    folder: Codestar
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
