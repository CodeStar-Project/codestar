spring.config.import=optional:classpath:application.dev.properties
spring.application.name=backend

# DataSource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/codestardb}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Profil + JWT
spring.profiles.active=dev
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Codestar — instance configuration
codestar.instance.config-path=${INSTANCE_CONFIG_PATH:classpath:instance.json}
codestar.signup.open=${SIGNUP_OPEN:false}

# Bootstrap super-admin (optional; empty email disables it). Mapped explicitly so the
# underscore env var names bind to the dashed property prefix.
codestar.bootstrap.super-admin.email=${CODESTAR_BOOTSTRAP_SUPER_ADMIN_EMAIL:}
codestar.bootstrap.super-admin.password=${CODESTAR_BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
codestar.bootstrap.super-admin.display-name=${CODESTAR_BOOTSTRAP_SUPER_ADMIN_DISPLAY_NAME:Super-admin}

# Media storage - local filesystem dir
codestar.media.storage-path=${MEDIA_STORAGE_PATH:./media}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Storage quotas (MB) — reject uploads that would exceed them
codestar.media.user-quota-mb=${MEDIA_USER_QUOTA_MB:100}
codestar.media.instance-quota-mb=${MEDIA_INSTANCE_QUOTA_MB:5000}
# Upload rate limit per user (token bucket): burst capacity + steady refill/minute
codestar.media.rate-limit.capacity=${MEDIA_RATE_LIMIT_CAPACITY:20}
codestar.media.rate-limit.refill-per-minute=${MEDIA_RATE_LIMIT_REFILL_PER_MINUTE:20}
# Idle bucket eviction: drop buckets untouched for N minutes; sweep runs every N ms.
codestar.media.rate-limit.idle-ttl-minutes=${MEDIA_RATE_LIMIT_IDLE_TTL_MINUTES:30}
codestar.media.rate-limit.sweep-ms=${MEDIA_RATE_LIMIT_SWEEP_MS:600000}

# CORS — comma-separated frontend origins
codestar.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# AI Course Generator
codestar.ai.api-url=${AI_API_URL:https://api.groq.com/openai/v1}
codestar.ai.api-key=${AI_API_KEY:}
codestar.ai.model=${AI_MODEL:llama-3.3-70b-versatile}
codestar.ai.max-tokens=${AI_MAX_TOKENS:16384}
codestar.ai.temperature=${AI_TEMPERATURE:0.4}
codestar.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}
codestar.ai.rate-limit-capacity=${AI_RATE_LIMIT_CAPACITY:5}
codestar.ai.rate-limit-refill-per-minute=${AI_RATE_LIMIT_REFILL_PER_MINUTE:2}
