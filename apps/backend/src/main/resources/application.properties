spring.config.import=optional:classpath:application.dev.properties
spring.application.name=backend

# DataSource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/codestardb}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Profil + JWT
spring.profiles.active=dev
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Codestar — instance configuration
codestar.instance.config-path=${INSTANCE_CONFIG_PATH:classpath:instance.json}
codestar.signup.open=${SIGNUP_OPEN:false}

# CORS — comma-separated frontend origins
codestar.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
