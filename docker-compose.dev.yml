# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Backend hot-reload (faster): run natively instead — `.\apps\backend\mvnw.cmd spring-boot:run`.
services:
  postgres:
    ports:
      - "5432:5432"

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_JPA_SHOW_SQL: "true"
    user: root

  frontend:
    build:
      target: build
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
    command: pnpm dev
