services:
  postgres:
    image: postgres:16-alpine
    container_name: codestar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codestar-net

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: codestar-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CODESTAR_SIGNUP_OPEN: ${SIGNUP_OPEN:-false}
      CODESTAR_BOOTSTRAP_SUPER_ADMIN_EMAIL: ${CODESTAR_BOOTSTRAP_SUPER_ADMIN_EMAIL:-}
      CODESTAR_BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${CODESTAR_BOOTSTRAP_SUPER_ADMIN_PASSWORD:-}
      CODESTAR_BOOTSTRAP_SUPER_ADMIN_DISPLAY_NAME: ${CODESTAR_BOOTSTRAP_SUPER_ADMIN_DISPLAY_NAME:-Super-admin}
      CODESTAR_INSTANCE_CONFIG_PATH: ${INSTANCE_CONFIG_PATH:-classpath:instance.json}
      MEDIA_STORAGE_PATH: /app/media
      MEDIA_USER_QUOTA_MB: ${MEDIA_USER_QUOTA_MB:-100}
      MEDIA_INSTANCE_QUOTA_MB: ${MEDIA_INSTANCE_QUOTA_MB:-5000}
      MEDIA_RATE_LIMIT_CAPACITY: ${MEDIA_RATE_LIMIT_CAPACITY:-20}
      MEDIA_RATE_LIMIT_REFILL_PER_MINUTE: ${MEDIA_RATE_LIMIT_REFILL_PER_MINUTE:-20}
      AI_API_URL: ${AI_API_URL:-https://api.groq.com/openai/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-llama-3.3-70b-versatile}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-8192}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.4}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-90}
      AI_RATE_LIMIT_CAPACITY: ${AI_RATE_LIMIT_CAPACITY:-5}
      AI_RATE_LIMIT_REFILL_PER_MINUTE: ${AI_RATE_LIMIT_REFILL_PER_MINUTE:-2}
    volumes:
      # ./config with the instance.json file by the INSTANCE_CONFIG_PATH=file:/app/config/instance.json
      - ./config:/app/config:ro
      # uploaded course images (persisted across restarts)
      - media_data:/app/media
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      # Public, no-auth endpoint → 200 once Spring is ready. busybox wget ships in the jre-alpine image.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/v1/instance/branding"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - codestar-net

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        JWT_SECRET: ${JWT_SECRET}
        AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-codestar_token}
        SITE_URL: ${SITE_URL:-http://localhost:3000}
    container_name: codestar-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://backend:8080
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-codestar_token}
      JWT_SECRET: ${JWT_SECRET}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - codestar-net

volumes:
  postgres_data:
  media_data:

networks:
  codestar-net:
    driver: bridge
