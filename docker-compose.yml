services:
  postgres:
    image: postgres:16-alpine
    container_name: codestar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codestar-net

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: codestar-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CODESTAR_SIGNUP_OPEN: ${SIGNUP_OPEN:-false}
      CODESTAR_BOOTSTRAP_SUPER_ADMIN_EMAIL: ${CODESTAR_BOOTSTRAP_SUPER_ADMIN_EMAIL:-}
      CODESTAR_BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${CODESTAR_BOOTSTRAP_SUPER_ADMIN_PASSWORD:-}
      CODESTAR_BOOTSTRAP_SUPER_ADMIN_DISPLAY_NAME: ${CODESTAR_BOOTSTRAP_SUPER_ADMIN_DISPLAY_NAME:-Super-admin}
      CODESTAR_INSTANCE_CONFIG_PATH: ${INSTANCE_CONFIG_PATH:-classpath:instance.json}
    volumes:
      # ./config with the instance.json file by the INSTANCE_CONFIG_PATH=file:/app/config/instance.json
      - ./config:/app/config:ro
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - codestar-net

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        JWT_SECRET: ${JWT_SECRET}
        AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-codestar_token}
        SITE_URL: ${SITE_URL:-http://localhost:3000}
    container_name: codestar-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: http://backend:8080
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-codestar_token}
      JWT_SECRET: ${JWT_SECRET}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - codestar-net

volumes:
  postgres_data:

networks:
  codestar-net:
    driver: bridge
